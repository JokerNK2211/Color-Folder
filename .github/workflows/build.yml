name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish src/ColorFolder/ColorFolder.csproj -c Release -o publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer\ColorFolder.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ColorFolder-Setup
          path: dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ColorFolder-portable
          path: publish/
